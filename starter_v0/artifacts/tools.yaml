# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Hỏi lại người dùng một câu và chờ lượt trả lời.
      QUY TẮC response_type:
      - Mọi yêu cầu gửi/đăng/publish (Telegram...) -> response_type="yes_no",
        câu hỏi xin xác nhận gửi, KỂ CẢ khi nội dung mới chỉ được nhắc chung
        chung ("bản tin này"). Không hỏi xin nội dung bằng text trong trường hợp này.
      - Thiếu handle, URL hoặc thông tin khác -> response_type="text".
      - Có danh sách lựa chọn -> response_type="choice" kèm options.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn, cụ thể."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "yes_no khi xin xác nhận trước khi gửi/đăng; choice khi có options; text cho thông tin còn thiếu."}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ dùng khi response_type=choice."}
      required: [question]

  - name: timeline
    description: >
      Lấy các bài đăng gần đây trên tài khoản X của một người. 
      Có thể dùng khi người dùng đã đưa ra tên là đủ, không cần cả @ hay handle. 
      Ví dụ Sam Altman -> sama, Elon Musk -> @elonmusk.
      Tool này không nên dùng khi người dùng chưa đưa ra tên cụ thể -> dùng clarify
      nếu tìm theo keyword -> social_search
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản hoặc handle không có @"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: >
      Tìm trên web (Tavily). DÙNG khi người dùng hỏi thông tin, tin tức, sự kiện
      chung trên internet và KHÔNG đưa URL cụ thể. KHÔNG dùng khi: cần bài đăng
      của một tài khoản X (dùng timeline), bài đăng X theo từ khóa (dùng
      social_search), hoặc đã có URL cần đọc (dùng fetch).
      Quy ước: query chỉ chứa CHỦ ĐỀ CỐT LÕI; loại tin nằm ở topic, thời gian
      nằm ở timeframe. Ví dụ:
      "Tin AI hôm nay" -> query="AI", topic="news", timeframe="day";
      "OpenAI tuần này" -> query="OpenAI", topic="news", timeframe="week";
      "robotics là gì" -> query="robotics", topic="general".
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >
            Chỉ chủ đề cốt lõi, 1-3 từ (ví dụ "robotics", "OpenAI"). KHÔNG thêm
            "news", "today", "latest", "tin tức", "hôm nay", "mới nhất" vào query;
            đã có topic và timeframe lo phần đó.
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: "news khi người dùng hỏi tin tức/sự kiện mới; general cho kiến thức chung."
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: "hôm nay=day, tuần này=week, tháng này=month, năm nay=year. Giữ nguyên giá trị của lượt trước nếu người dùng nói 'vẫn là...' hoặc không đổi."
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa; chỉ đổi khi người dùng nêu số lượng."}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Gửi text lên Telegram. KHÔNG gọi ở lần đầu người dùng yêu cầu gửi/đăng;
      phải gọi clarify(response_type="yes_no") trước. Chỉ gọi send sau khi
      người dùng đã đồng ý ở lượt sau, với confirmed=true.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung đúng như đã cho người dùng xem."}
        confirmed: {type: boolean, default: false, description: "true chỉ khi người dùng vừa xác nhận ở lượt gần nhất."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
